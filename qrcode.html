<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Portal — SPPG Jeungjing</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20260903c">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="stylesheet" href="rebrand.css?v=20260903c">
</head>
<body class="qr-page">
  <div class="bg-decor" aria-hidden="true">
    <div class="blob blob--sky-top"></div>
    <div class="blob blob--gold-left"></div>
    <div class="blob blob--sky-bottom"></div>
  </div>

  <div class="qr-card">
    <div class="qr-logos">
      <img src="assets/logo.png" alt="Logo SPPG Jeungjing" class="qr-logo">
      <img src="assets/logo-bgn.png" alt="Logo Badan Gizi Nasional" class="qr-logo">
    </div>
    <h1>SPPG JEUNGJING</h1>
    <p class="qr-subtitle">QR Code Portal SPPG Jeungjing</p>
    <div id="qrcodeContainer" class="qr-box"></div>
    <!--
      PENTING: QR ini mengarah ke portal.html (halaman depan Portal
      Relawan/Admin), BUKAN ke Absensi dan BUKAN ke Website Publik
      (index.html). Memindai QR ini TIDAK otomatis mencatat absen apa
      pun -- setelah Portal terbuka, pengguna tetap login lalu memilih
      sendiri menu Absensi/Informasi/Jadwal/dst sesuai kebutuhan.
    -->
    <p class="qr-instruction">Scan untuk membuka Portal SPPG Jeungjing.</p>

    <div class="no-print" style="display:flex;flex-direction:column;gap:8px;margin-top:10px;">
      <button class="btn-secondary" id="btnSalinLink">🔗 Salin Link Portal</button>
      <button class="btn-secondary" id="btnBagikan" style="display:none;">📤 Bagikan Portal</button>
      <button class="btn-secondary" onclick="window.print()">🖨️ Cetak QR Code</button>
    </div>

    <p class="no-print" style="font-size:11.5px;color:var(--color-text-muted);margin-top:14px;">
      Halaman ini untuk Admin — cetak/bagikan QR ini di lokasi atau grup relawan.<br>
      <a href="admin.html" class="admin-link" style="margin-top:6px;">← Kembali ke Dashboard Admin</a>
    </p>
    <p class="credit no-print" style="margin-top:18px;">© 2026 SPPG Jeungjing · Developed by Fatur Rizky Fahriansyah</p>
  </div>

  <div class="toast is-hidden" id="qrToast" role="alert" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#12294d;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;"></div>

  <script>
    // QR mengarah ke portal.html (halaman depan Portal, BUKAN Absensi,
    // BUKAN Website Publik) -- alur yang benar:
    // Scan QR -> Buka Portal -> Login -> Dashboard sesuai role -> pilih fitur.
    var targetUrl = window.location.origin + window.location.pathname.replace('qrcode.html', 'portal.html');

    new QRCode(document.getElementById('qrcodeContainer'), {
      text: targetUrl,
      width: 240,
      height: 240,
      colorDark: '#14304F',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    });

    function tampilkanToast(pesan) {
      var toast = document.getElementById('qrToast');
      toast.textContent = pesan;
      toast.classList.remove('is-hidden');
      setTimeout(function () { toast.classList.add('is-hidden'); }, 2500);
    }

    document.getElementById('btnSalinLink').addEventListener('click', function () {
      navigator.clipboard.writeText(targetUrl).then(function () {
        tampilkanToast('Link Portal disalin ke clipboard.');
      }).catch(function () {
        tampilkanToast('Gagal menyalin. Salin manual: ' + targetUrl);
      });
    });

    if (navigator.share) {
      var btnBagikan = document.getElementById('btnBagikan');
      btnBagikan.style.display = 'block';
      btnBagikan.addEventListener('click', function () {
        navigator.share({
          title: 'Portal SPPG Jeungjing',
          text: 'Buka Portal SPPG Jeungjing untuk akses Absensi, Jadwal, Informasi, dan layanan lainnya.',
          url: targetUrl
        }).catch(function () { /* dibatalkan pengguna -- wajar, diamkan */ });
      });
    }
  </script>
</body>
</html>
